<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15171F"/>
      <stop offset="100%" stop-color="#0D0E12"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F95738"/>
      <stop offset="60%" stop-color="#FF7B4D"/>
      <stop offset="100%" stop-color="#FFB020"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFB020"/>
      <stop offset="100%" stop-color="#FFF3B0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#F95738" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#2D3240" stroke-width="2"/>

  <!-- Athletic Flame Mark -->
  <g filter="url(#glow)">
    <path d="M 256,96 C 266,160 300,195 330,225 C 362,257 376,295 376,340 C 376,406 322,448 256,448 C 190,448 136,406 136,340 C 136,275 180,210 230,165 C 236,195 248,220 270,235 C 265,190 256,135 256,96 Z" fill="url(#flameGrad)"/>
    <!-- Flame Core -->
    <path d="M 256,270 C 265,300 288,320 300,340 C 308,354 312,368 312,382 C 312,416 287,432 256,432 C 225,432 200,416 200,382 C 200,350 224,320 244,295 C 248,310 255,320 264,326 C 260,305 256,285 256,270 Z" fill="url(#coreGrad)"/>
  </g>
</svg>
